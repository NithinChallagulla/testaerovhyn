<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AEROVHYN – Drone CCTV Wall</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

.wall {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  width: 100vw;
  height: 100vh;
}

.feed {
  position: relative;
  background: #000;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

.label {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 4px 8px;
  font-size: 12px;
  color: #00ffff;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.9),
    rgba(0,0,0,0.2)
  );
  z-index: 2;
}

.offline {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ff4b4b;
  font-size: 14px;
  background: rgba(0,0,0,0.6);
  z-index: 1;
}
</style>
</head>

<body>
<div class="wall" id="wall"></div>

<script>
/* ✅ PUBLIC CLOUDFLARE BASE */
const BASE = "https://streams.aerovhyn.in";

/* add all streams here */
const streams = [
  { name: "Gunadala PS", path: "/streams/Gunadala_Ps/index.m3u8" },
  { name: "Machavaram PS", path: "/streams/Machavaram_Ps/index.m3u8" },

  { name: "1 Town PS", path: "/streams/1_Town_PS/index.m3u8" },
  { name: "2 Town PS", path: "/streams/2_Town_PS/index.m3u8" },
  { name: "Bhavanipuram PS", path: "/streams/Bhavanipuram_Ps/index.m3u8" },
  { name: "Ibrahimpatnam PS", path: "/streams/Ibrahimpatnam_Ps/index.m3u8" },
  { name: "Satyanarayanapuram PS", path: "/streams/Satyanarayanapuram_Ps/index.m3u8" },
  { name: "Nunna PS", path: "/streams/Nunna_Ps/index.m3u8" },
  { name: "Ajith Singh Nagar PS", path: "/streams/Ajith_Singh_Nagar_Ps/index.m3u8" },
  { name: "GRPET PS", path: "/streams/GRPET_PS/index.m3u8" },
  { name: "Krishnalanka PS", path: "/streams/Krishnalanka_Ps/index.m3u8" },
  { name: "Nandigama PS", path: "/streams/Nandigama_Ps/index.m3u8" },
  { name: "Veerulapadu PS", path: "/streams/Veerulapadu_Ps/index.m3u8" },
  { name: "Kanchikacherla PS", path: "/streams/Kanchikacherla_Ps/index.m3u8" },
  { name: "Chandarlapadu PS", path: "/streams/Chandarlapadu_Ps/index.m3u8" },
  { name: "Jaggaiahpet PS", path: "/streams/Jaggaiahpet_Ps/index.m3u8" },
  { name: "Penuganchiprolu PS", path: "/streams/Penuganchiprolu_Ps/index.m3u8" },
  { name: "Vatsavai PS", path: "/streams/Vatsavai_Ps/index.m3u8" },
  { name: "Chillakallu PS", path: "/streams/Chillakallu_Ps/index.m3u8" },
  { name: "A. Konduru PS", path: "/streams/A_Konduru_Ps/index.m3u8" },
  { name: "G Konduru PS", path: "/streams/G_Konduru_Ps/index.m3u8" },
  { name: "Mylavaram PS", path: "/streams/Mylavaram_Ps/index.m3u8" },
  { name: "Reddigudem PS", path: "/streams/Reddigudem_Ps/index.m3u8" },
  { name: "Tiruvuru PS", path: "/streams/Tiruvuru_Ps/index.m3u8" },
  { name: "Vissannapeta PS", path: "/streams/Vissannapeta_Ps/index.m3u8" },
  { name: "Gampalagudem PS", path: "/streams/Gampalagudem_Ps/index.m3u8" },

  { name: "Traffic Sec 1 – Charli 1", path: "/streams/Traffic_Sec1_Charli1/index.m3u8" },
  { name: "Traffic Sec 2 – Charli 2", path: "/streams/Traffic_Sec2_Charli2/index.m3u8" },
  { name: "Traffic Sec 1 – Charli 3", path: "/streams/Traffic_Sec1_Charli3/index.m3u8" },
  { name: "Traffic Sec 2 – Charli 4", path: "/streams/Traffic_Sec2_Charli4/index.m3u8" },
  { name: "Traffic Charli 7", path: "/streams/Traffic_Charli7/index.m3u8" },
  { name: "Traffic Sec 1 – Charli 9", path: "/streams/Traffic_Sec1_Charli9/index.m3u8" },
  { name: "Traffic Sec 2 – Charli 10", path: "/streams/Traffic_Sec2_Charli10/index.m3u8" },
  { name: "Traffic Sec 3 – Charli 11", path: "/streams/Traffic_Sec3_Charli11/index.m3u8" },
  { name: "Traffic Sec 1 – Charli 5", path: "/streams/Traffic_Sec1_Charli5/index.m3u8" },
  { name: "Traffic Sec 2 – Charli 6", path: "/streams/Traffic_Sec2_Charli6/index.m3u8" },
  { name: "Traffic Charli 8", path: "/streams/Traffic_Charli8/index.m3u8" },

  { name: "ABLE 2 Sir", path: "/streams/ABLE_2_Sir/index.m3u8" },
  { name: "ADCP Sir", path: "/streams/ADCP_Sir/index.m3u8" },
  { name: "Command Control", path: "/streams/Command_Control/index.m3u8" }
];


const wall = document.getElementById("wall");

function createFeed({ name, path }) {
  const feed = document.createElement("div");
  feed.className = "feed";

  const video = document.createElement("video");
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = name;

  const offline = document.createElement("div");
  offline.className = "offline";
  offline.textContent = "NO SIGNAL";
  offline.style.display = "none";

  feed.append(video, label, offline);
  wall.appendChild(feed);

  const url = BASE + path;
  let hls;

  function start() {
    offline.style.display = "none";

    if (Hls.isSupported()) {
      hls = new Hls({
        liveDurationInfinity: true,
        enableWorker: true,
        maxBufferLength: 30,
        backBufferLength: 60
      });

      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
          stop();
          retry();
        }
      });
    } else {
      video.src = url;
    }
  }

  function stop() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
    video.removeAttribute("src");
    video.load();
    offline.style.display = "flex";
  }

  function retry() {
    setTimeout(start, 5000); // retry every 5s
  }

  start();
}

streams.forEach(createFeed);
</script>
</body>
</html>
