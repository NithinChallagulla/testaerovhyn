<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AEROVHYN – Drone CCTV Wall</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

.wall {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  width: 100vw;
  height: 100vh;
}

.feed {
  position: relative;
  background: #000;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

.label {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 4px 8px;
  font-size: 12px;
  color: #00ffff;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.9),
    rgba(0,0,0,0.2)
  );
  z-index: 2;
}

.offline {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ff4b4b;
  font-size: 14px;
  background: rgba(0,0,0,0.6);
  z-index: 1;
}
</style>
</head>

<body>
<div class="wall" id="wall"></div>

<script>
/* ✅ PUBLIC CLOUDFLARE BASE */
const BASE = "https://streams.aerovhyn.in";

/* add all streams here */
const streams = [
  { name: "Gunadala PS", path: "/streams/Gunadala_Ps/index.m3u8" },
  { name: "Machavaram PS", path: "/streams/Machavaram_Ps/index.m3u8" },
  { name: "Patamata PS", path: "/streams/Patamata_PS/index.m3u8" },
  { name: "1 Town PS", path: "/streams/1_Town_PS/index.m3u8" },
  { name: "Bhavanipuram PS", path: "/streams/Bhavanipuram_Ps/index.m3u8" },
  { name: "Command Control", path: "/streams/Command_Control/index.m3u8" }
];

const wall = document.getElementById("wall");

function createFeed({ name, path }) {
  const feed = document.createElement("div");
  feed.className = "feed";

  const video = document.createElement("video");
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = name;

  const offline = document.createElement("div");
  offline.className = "offline";
  offline.textContent = "NO SIGNAL";
  offline.style.display = "none";

  feed.append(video, label, offline);
  wall.appendChild(feed);

  const url = BASE + path;
  let hls;

  function start() {
    offline.style.display = "none";

    if (Hls.isSupported()) {
      hls = new Hls({
        liveDurationInfinity: true,
        enableWorker: true,
        maxBufferLength: 30,
        backBufferLength: 60
      });

      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
          stop();
          retry();
        }
      });
    } else {
      video.src = url;
    }
  }

  function stop() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
    video.removeAttribute("src");
    video.load();
    offline.style.display = "flex";
  }

  function retry() {
    setTimeout(start, 5000); // retry every 5s
  }

  start();
}

streams.forEach(createFeed);
</script>
</body>
</html>
